---
services:
  overseerr:
    image: sctx/overseerr:1.34.0
    container_name: overseerr
    ports:
      - ${REQUEST_PORT}:5055
    volumes:
      - ./config/:/app/config
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Amsterdam
    restart: unless-stopped
    labels:
      - homepage.group=RomanTV
      - homepage.name=Overseerr
      - homepage.icon=overseerr.png
      - homepage.href=https://request.${DOMAIN_NAME}/
