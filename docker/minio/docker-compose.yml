services:
  minio:
    image: docker.io/bitnami/minio:2022
    ports:
      - ${S3_PORT}:9000
      - ${MINIO_PORT}:9001
    volumes:
      - "minio_data:/data"
    environment:
      - MINIO_ROOT_USER=root
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_DEFAULT_BUCKETS=data

volumes:
  minio_data:
    driver: local
