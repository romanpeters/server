services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    environment:
      - MINIO_ROOT_USER=root
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    security_opt:
      - "apparmor:unconfined"
    ports:
      - ${S3_PORT}:9000
      - ${MINIO_PORT}:9001
    volumes:
      - /mnt/containers/minio:/data
    command: server /data --console-address ":9001"
