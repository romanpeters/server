---
- name: Verify Nginx Reverse Proxy
  hosts: all
  gather_facts: true
  tasks:
    - name: Ensure Nginx package is installed
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Ensure services site is enabled
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/services.conf
        state: link

    - name: Check Nginx is listening on port 80
      ansible.builtin.shell: netstat -tln | grep ':80 '
      register: nginx_port

    - name: Assert port 80 is listening
      ansible.builtin.assert:
        that:
          - nginx_port.rc == 0