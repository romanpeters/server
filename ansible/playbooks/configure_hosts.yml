---
- name: Configure hosts based on roles in host_vars
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Apply roles defined for this host
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop: "{{ configure | default([]) }}"
      when: role_to_run is not defined or item == role_to_run
