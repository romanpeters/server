---
- name: Configure hosts based on roles in host_vars
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Apply roles defined for this host
      ansible.builtin.include_role:
        name: "{{ role_name }}"
      loop: "{{ configure | default([]) }}"
      loop_control:
        loop_var: role_name
      when: role_to_run is not defined or role_name == role_to_run
