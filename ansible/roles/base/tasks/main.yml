---
# tasks file for base
- name: Include packages tasks
  ansible.builtin.include_tasks: packages.yml

- name: Include user tasks
  ansible.builtin.include_tasks: user.yml

- name: Include ssh tasks
  ansible.builtin.include_tasks: ssh.yml

- name: Include shell tasks
  ansible.builtin.include_tasks: shell.yml

- name: Include config tasks
  ansible.builtin.include_tasks: config.yml

- name: Include localization tasks
  ansible.builtin.include_tasks: localization.yml

- name: Include Ubunutu tasks
  ansible.builtin.include_tasks: ubuntu.yml
  when: ansible_facts['distribution'] == 'Ubuntu'
