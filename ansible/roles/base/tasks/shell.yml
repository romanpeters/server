---
- name: Install Zsh
  ansible.builtin.package:
    name: zsh
    state: present

- name: Clone Oh My Zsh repository
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: /home/{{ username }}/.oh-my-zsh
  become: true
  become_user: "{{ username }}"

- name: Install zsh-autosuggestions plugin
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: /home/{{ username }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions
  become: true
  become_user: "{{ username }}"

- name: Install zsh-syntax-highlight plugin
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    dest: /home/{{ username }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting
  become: true
  become_user: "{{ username }}"

- name: Create zshrc file
  ansible.builtin.copy:
    src: "zshrc"
    dest: /home/{{ username }}/.zshrc
    owner: "{{ username }}"
    group: "{{ username }}"
    force: no

- name: Ensure zshenv content
  ansible.builtin.blockinfile:
    path: "/home/{{ username }}/.zshenv"
    owner: "{{ username }}"
    group: "{{ username }}"
    create: yes
    block: |
      {{ lookup('file', 'zshenv') }}

- name: Change user's shell to Zsh
  ansible.builtin.user:
    name: "{{ username }}"
    shell: /bin/zsh
