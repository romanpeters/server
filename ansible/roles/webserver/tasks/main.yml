---
# tasks file for webserver role

- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy services reverse proxy config
  template:
    src: services.conf.j2
    dest: /etc/nginx/sites-available/services.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Enable services site
  file:
    src: /etc/nginx/sites-available/services.conf
    dest: /etc/nginx/sites-enabled/services.conf
    state: link
  notify: Reload nginx
