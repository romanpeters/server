---
repos:
  - repo: local
    hooks:
      - id: prettier-yaml
        name: Prettier (YAML)
        entry: prettier --write
        language: system
        types: [yaml]
        exclude: ^\.yamllint$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        additional_dependencies: ["ansible"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.32.0
    hooks:
      - id: yamllint
        files: \.(yml|yaml)$

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint

  # Local integration test scripts
  - repo: local
    hooks:
      - id: terraform-tests
        name: Run Terraform tests
        entry: /bin/bash tests/test_terraform.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: ansible-tests
        name: Run Ansible tests
        entry: /bin/bash tests/test_ansible.sh
        language: script
        pass_filenames: false
        always_run: true
